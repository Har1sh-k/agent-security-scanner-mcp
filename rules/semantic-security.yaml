    cwe: "CWE-1321"
    owasp: "A03:2021 - Injection"
    confidence: high
    impact: high
    description: "Modifying Object.prototype allows attackers to inject properties into all objects"
    remediation: "Use Map instead of objects, or Object.create(null)"

- id: semantic.regex-dos
